name: Final release fix

on:
  push:
    branches:
      - qa/final-release-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function update(file, transform) {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`No change made to ${file}`);
            fs.writeFileSync(file, after, 'utf8');
            console.log(`Updated ${file}`);
          }

          update('app/admin/inventory/inventory-client.tsx', (text) => {
            const oldText = 'function csvEscape(value: string | number) {';
            const newText = 'function csvEscape(value: string | number | boolean) {';
            if (!text.includes(oldText)) throw new Error('Inventory target not found');
            return text.replace(oldText, newText);
          });

          update('components/site-utilities.tsx', (text) => {
            const pattern = /(price:\s*Number\(product\.price\),\s*)quantity:\s*1,\s*(?=tone:)/;
            if (!pattern.test(text)) throw new Error('Cart quantity target not found');
            return text.replace(pattern, '$1');
          });

          update('app/api/cms/home/route.ts', (text) => {
            if (!text.includes('function normalizeMarquee(')) throw new Error('normalizeMarquee target not found');
            const oldBlock = `function normalizeMarquee(section: { section_key: string; content: Record<string, any>; active: boolean; sort_order: number }) {\n  if (section.section_key !== "marquee") return section;\n  const content = section.content || {};\n  const rawItems = Array.isArray(content.items)\n    ? content.items.map((item: unknown) => String(item || "").trim()).filter(Boolean)\n    : [];\n  let items = rawItems;\n  if (!items.length && typeof content.text === "string") items = content.text.split("·").map((item: string) => item.trim()).filter(Boolean);\n  if (!items.length) items = ["PLANT MORE JOY"];\n  const sequence = \`${'${items.join(" · ")}' } ·\`;\n  return { ...section, content: { ...content, items, text: \`${'${sequence} ${sequence}' }\` } };\n}`;
            const newBlock = `function marqueeText(item: unknown) {\n  if (typeof item === "string") {\n    const value = item.trim();\n    return value === "[object Object]" ? "" : value;\n  }\n  if (item && typeof item === "object") {\n    const value = item as Record<string, unknown>;\n    return String(value.text ?? value.label ?? value.title ?? value.value ?? "").trim();\n  }\n  return "";\n}\n\nfunction normalizeMarquee(section: { section_key: string; content: Record<string, any>; active: boolean; sort_order: number }) {\n  if (section.section_key !== "marquee") return section;\n  const content = section.content || {};\n  const rawItems = Array.isArray(content.items) ? content.items.map(marqueeText).filter(Boolean) : [];\n  let items = rawItems;\n  if (!items.length && typeof content.text === "string") {\n    items = content.text.split("·").map((item: string) => item.trim()).filter(Boolean).filter((item: string) => item !== "[object Object]");\n  }\n  if (!items.length) items = ["PLANT MORE JOY"];\n  const sequence = \`${'${items.join(" · ")}' } ·\`;\n  return { ...section, content: { ...content, items, text: \`${'${sequence} ${sequence}' }\` } };\n}`;
            if (!text.includes(oldBlock)) throw new Error('normalizeMarquee exact block not found');
            let next = text.replace(oldBlock, newBlock);
            const oldCare = 'if (merged.section_key === "care" && (!Array.isArray(merged.content.items) || !merged.content.items.length)) merged.content.items = fallback?.content.items || [];';
            const newCare = 'if (merged.section_key === "care" && (!Array.isArray(merged.content.items) || !merged.content.items.length)) merged.content.items = (fallback?.content as any)?.items || [];';
            if (!next.includes(oldCare)) throw new Error('CMS care type target not found');
            next = next.replace(oldCare, newCare);
            return next;
          });

          update('app/admin/home/home-manager.tsx', (text) => {
            const oldFunction = `  function marqueeItems(section: Section) {\n    const items = Array.isArray(section.content.items) ? section.content.items.map((item: unknown) => String(item || "").trim()).filter(Boolean) : [];\n    if (items.length) return items;`;
            const newFunction = `  function marqueeText(item: unknown) {\n    if (typeof item === "string") {\n      const value = item.trim();\n      return value === "[object Object]" ? "" : value;\n    }\n    if (item && typeof item === "object") {\n      const value = item as Record<string, unknown>;\n      return String(value.text ?? value.label ?? value.title ?? value.value ?? "").trim();\n    }\n    return "";\n  }\n\n  function marqueeItems(section: Section) {\n    const items = Array.isArray(section.content.items) ? section.content.items.map(marqueeText).filter(Boolean) : [];\n    if (items.length) return items;`;
            if (!text.includes(oldFunction)) throw new Error('Admin marquee function target not found');
            return text.replace(oldFunction, newFunction);
          });

          update('app/order-confirmation/page.tsx', (text) => {
            if (!text.includes('import { useEffect, useState } from "react";')) throw new Error('Order import target not found');
            let next = text.replace('import { useEffect, useState } from "react";', 'import { Suspense, useEffect, useState } from "react";');
            const oldExport = 'export default function OrderConfirmationPage() {';
            if (!next.includes(oldExport)) throw new Error('Order export target not found');
            next = next.replace(oldExport, 'function OrderConfirmationContent() {');
            const marker = '\nfunction Info({ label, value }: { label: string; value: string }) {';
            if (!next.includes(marker)) throw new Error('Order insertion point not found');
            const wrapper = `\nexport default function OrderConfirmationPage() {\n  return (\n    <Suspense\n      fallback={\n        <main className="flex min-h-screen items-center justify-center bg-[#f4f5e9] text-[#101510]">\n          <div className="text-center">\n            <p className="text-[10px] font-bold tracking-[.2em] text-black/40">VERDANT</p>\n            <p className="mt-4 text-sm text-black/50">Loading your order…</p>\n          </div>\n        </main>\n      }\n    >\n      <OrderConfirmationContent />\n    </Suspense>\n  );\n}\n`;
            return next.replace(marker, wrapper + marker);
          });

          if (text => false) {}
          NODE

      - name: Verify diff
        run: git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/inventory/inventory-client.tsx components/site-utilities.tsx app/api/cms/home/route.ts app/admin/home/home-manager.tsx app/order-confirmation/page.tsx
          git rm .github/workflows/final-release-fix.yml
          git commit -m "fix: complete release QA blockers"
          git push origin HEAD:qa/final-release-fix
