name: Final release fix

on:
  push:
    branches:
      - qa/final-release-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function update(file, fn) {
            const before = fs.readFileSync(file, 'utf8');
            const after = fn(before);
            if (after === before) throw new Error(`No change made to ${file}`);
            fs.writeFileSync(file, after, 'utf8');
            console.log(`Updated ${file}`);
          }

          update('app/admin/inventory/inventory-client.tsx', (text) => {
            const from = 'function csvEscape(value: string | number) {';
            const to = 'function csvEscape(value: string | number | boolean) {';
            if (!text.includes(from)) throw new Error('Inventory target not found');
            return text.replace(from, to);
          });

          update('components/site-utilities.tsx', (text) => {
            const pattern = /(price:\s*Number\(product\.price\),\s*)quantity:\s*1,\s*(?=tone:)/;
            if (!pattern.test(text)) throw new Error('Cart quantity target not found');
            return text.replace(pattern, '$1');
          });

          update('app/api/cms/home/route.ts', (text) => {
            const anchor = 'function normalizeMarquee(section: { section_key: string; content: Record<string, any>; active: boolean; sort_order: number }) {';
            if (!text.includes(anchor)) throw new Error('CMS marquee function not found');
            let next = text;
            const helper = `function marqueeText(item: unknown) {\n  if (typeof item === "string") {\n    const value = item.trim();\n    return value === "[object Object]" ? "" : value;\n  }\n  if (item && typeof item === "object") {\n    const value = item as Record<string, unknown>;\n    return String(value.text ?? value.label ?? value.title ?? value.value ?? "").trim();\n  }\n  return "";\n}\n\n`;
            if (!next.includes('function marqueeText(item: unknown)')) next = next.replace(anchor, helper + anchor);
            next = next.replace('content.items.map((item: unknown) => String(item || "").trim()).filter(Boolean)', 'content.items.map(marqueeText).filter(Boolean)');
            next = next.replace('items = content.text.split("·").map((item: string) => item.trim()).filter(Boolean);', 'items = content.text.split("·").map((item: string) => item.trim()).filter(Boolean).filter((item: string) => item !== "[object Object]");');
            const oldCare = 'if (merged.section_key === "care" && (!Array.isArray(merged.content.items) || !merged.content.items.length)) merged.content.items = fallback?.content.items || [];';
            const newCare = 'if (merged.section_key === "care" && (!Array.isArray(merged.content.items) || !merged.content.items.length)) merged.content.items = (fallback?.content as any)?.items || [];';
            if (!next.includes(oldCare)) throw new Error('CMS care type target not found');
            return next.replace(oldCare, newCare);
          });

          update('app/admin/home/home-manager.tsx', (text) => {
            const anchor = '  function marqueeItems(section: Section) {';
            if (!text.includes(anchor)) throw new Error('Admin marquee target not found');
            let next = text;
            const helper = `  function marqueeText(item: unknown) {\n    if (typeof item === "string") {\n      const value = item.trim();\n      return value === "[object Object]" ? "" : value;\n    }\n    if (item && typeof item === "object") {\n      const value = item as Record<string, unknown>;\n      return String(value.text ?? value.label ?? value.title ?? value.value ?? "").trim();\n    }\n    return "";\n  }\n\n`;
            if (!next.includes('  function marqueeText(item: unknown) {')) next = next.replace(anchor, helper + anchor);
            return next.replace('section.content.items.map((item: unknown) => String(item || "").trim()).filter(Boolean)', 'section.content.items.map(marqueeText).filter(Boolean)');
          });

          update('app/order-confirmation/page.tsx', (text) => {
            if (!text.includes('import { useEffect, useState } from "react";')) throw new Error('Order import target not found');
            let next = text.replace('import { useEffect, useState } from "react";', 'import { Suspense, useEffect, useState } from "react";');
            const oldExport = 'export default function OrderConfirmationPage() {';
            if (!next.includes(oldExport)) throw new Error('Order export target not found');
            next = next.replace(oldExport, 'function OrderConfirmationContent() {');
            const marker = '\nfunction Info({ label, value }: { label: string; value: string }) {';
            if (!next.includes(marker)) throw new Error('Order insertion point not found');
            const wrapper = `\nexport default function OrderConfirmationPage() {\n  return (\n    <Suspense\n      fallback={\n        <main className="flex min-h-screen items-center justify-center bg-[#f4f5e9] text-[#101510]">\n          <div className="text-center">\n            <p className="text-[10px] font-bold tracking-[.2em] text-black/40">VERDANT</p>\n            <p className="mt-4 text-sm text-black/50">Loading your order…</p>\n          </div>\n        </main>\n      }\n    >\n      <OrderConfirmationContent />\n    </Suspense>\n  );\n}\n`;
            return next.replace(marker, wrapper + marker);
          });
          NODE

      - name: Verify diff
        run: git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/inventory/inventory-client.tsx components/site-utilities.tsx app/api/cms/home/route.ts app/admin/home/home-manager.tsx app/order-confirmation/page.tsx
          git rm .github/workflows/final-release-fix.yml
          git commit -m "fix: complete release QA blockers"
          git push origin HEAD:qa/final-release-fix
